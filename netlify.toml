# Netlify configuration for the Antra website + Pay4U backend.
[build]
  publish = "."                      # the website files are in the repo root
  functions = "netlify/functions"    # serverless functions live here

# Pretty URLs -> serverless functions
[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/pay"
  status = 200

[[redirects]]
  from = "/payment-success"
  to = "/.netlify/functions/payment-success"
  status = 200

[[redirects]]
  from = "/payment-failure"
  to = "/.netlify/functions/payment-failure"
  status = 200

# --- Old Shopify URLs → new site (so old links / bookmarks / Google results don't 404) ---
[[redirects]]
  from = "/collections/frontpage"
  to = "/shop.html"
  status = 301
[[redirects]]
  from = "/collections/*"
  to = "/shop.html"
  status = 301
[[redirects]]
  from = "/products/*"
  to = "/shop.html"
  status = 301
[[redirects]]
  from = "/pages/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/shop.html"
  status = 301
[[redirects]]
  from = "/account/*"
  to = "/"
  status = 301
